name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - name: Compile native worker
        if: runner.os == 'macOS'
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator clang -target arm64-apple-ios18.0-simulator -isysroot "$sdk" \
            -dynamiclib -framework Foundation -fobjc-arc -Wall -Wextra -Werror \
            native/worker.m -o "$RUNNER_TEMP/widgetctl-worker.dylib"
      - run: npm pack --dry-run
